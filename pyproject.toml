[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ones"
version = "0.1.0"
description = "ONES many-to-many relationship demos (IdP, database, teams)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
